}

button.primary{background:var(--blue);color:white;border:0;border-radius:9px;padding:13px 18px;font-weight:800}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 15px;font-weight:700}
.login{max-width:410px;margin:12vh auto;padding:28px}
.login .logo{font-size:27px}
.error{color:#dc2626;font-size:13px;min-height:20px;margin-top:10px}
.row{display:flex;gap:10px;align-items:end}
.row>*{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.signal{padding:18px;border-radius:12px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel2)}
